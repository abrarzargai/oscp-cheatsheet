<title>Cheatsheet</title>
<style>
  :root{
    --bg:#050806;
    --surface:#0a120b;
    --surface-2:#0f1c11;
    --border:#1c3322;
    --ink:#b9f2c0;
    --bright:#49ff7e;
    --dim:#4f7a5a;
    --danger:#ff5f5f;
    --code-bg:#071009;
    --code-ink:#c9ffd2;
    --focus:#49ff7e;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px -12px rgba(0,0,0,.75);
  }

  *{box-sizing:border-box;}
  html,body{ height:100%; overflow:hidden; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--bright); color:#01120a; }

  .app{
    height:100dvh;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:20px;
    overflow:hidden;
    background:var(--bg);
  }

  /* Shared card surface — every panel (sidebar sections + main sections) uses this */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:var(--shadow);
  }

  /* ---------- Top bar (2 cards: brand | attacker+victim config) ---------- */
  .topbar{
    display:grid;
    grid-template-columns:280px 1fr;
    gap:20px;
    position:sticky;
    top:0;
    z-index:30;
  }
  .topbar-left{
    padding:18px;
    display:flex;
    align-items:center;
    gap:.6rem;
    min-width:0;
  }
  .topbar-right{
    padding:5px 18px 12px 18px;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:.6rem 1rem;
    min-width:0;
  }

  .brand{ display:flex; flex-direction:column; gap:.3rem; min-width:0; }
  .brand-lockup{
    position:relative;
    display:inline-flex;
    align-items:baseline;
    padding-bottom:.3rem;
    max-width:100%;
  }
  .brand-bracket{ color:var(--dim); font-weight:700; font-size:1.05rem; }
  .brand-mark{
    font-weight:800;
    font-size:1.05rem;
    letter-spacing:.02em;
    color:var(--ink);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .brand-mark-alt{ color:var(--bright); }
  .brand-skull{ color:var(--bright); flex:none; margin:0 .2em; }
  .brand-name-neon{
    display:block;
    font-size:.72rem;
    font-weight:800;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--bright);
    text-shadow:
      0 0 4px var(--bright),
      0 0 10px var(--bright),
      0 0 18px rgba(73,255,126,.75),
      0 0 32px rgba(73,255,126,.45);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:100%;
  }
  .brand-lockup::after{
    content:"";
    position:absolute;
    left:0; bottom:0;
    width:2.6rem;
    height:2px;
    background:var(--bright);
  }
  .brand-stats{
    font-size:.64rem;
    letter-spacing:.02em;
    color:var(--dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:100%;
    cursor:default;
  }

  .menu-toggle{
    display:none;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:2px;
    width:2.1rem;
    height:2.1rem;
    cursor:pointer;
    align-items:center;
    justify-content:center;
    flex:none;
  }
  .menu-toggle .bars{ position:relative; display:block; width:1rem; height:2px; background:var(--ink); }
  .menu-toggle .bars::before,.menu-toggle .bars::after{
    content:""; position:absolute; left:0; width:100%; height:2px; background:var(--ink);
  }
  .menu-toggle .bars::before{ top:-6px; }
  .menu-toggle .bars::after{ top:6px; }
  .menu-toggle:hover{ border-color:var(--bright); }
  .menu-toggle:hover .bars,.menu-toggle:hover .bars::before,.menu-toggle:hover .bars::after{ background:var(--bright); }
  .menu-toggle:focus-visible{ outline:2px solid var(--focus); outline-offset:1px; }

  .cfg-groups{ display:flex; gap:.7rem; flex:1 1 auto; min-width:0; }
  fieldset.cfg-group{
    flex:1 1 0;
    display:flex;
    flex-wrap:wrap;
    align-items:flex-end;
    gap:.5rem .9rem;
    min-width:0;
    margin:0;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius: 10px;
    padding:.55rem .7rem .5rem;
  }
  fieldset.cfg-group legend{
    padding:0 .35rem;
    font-size:.66rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--bright);
    font-weight:700;
  }

  .cfg-field{ display:flex; flex-direction:column; gap:.15rem; }
  .cfg-field label{
    font-size:.62rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--dim);
    display:flex;
    align-items:center;
  }
  .status-dot{ font-weight:700; color:var(--dim); white-space:pre; }
  .status-dot.on{ color:var(--bright); }
  .cfg-field input{
    font-family:inherit;
    font-variant-numeric:tabular-nums;
    font-size:.82rem;
    width:100%;
    background:var(--bg);
    color:var(--ink);
    border:1px solid var(--border);
    border-radius:2px;
    padding:.4rem .55rem;
  }
  .cfg-field input::placeholder{ color:var(--dim); opacity:.7; }
  .cfg-field input:focus-visible{ outline:2px solid var(--focus); outline-offset:1px; }
  .cfg-input-wrap{ position:relative; width:10.5rem; }
  .cfg-field.port .cfg-input-wrap{ width:5rem; }
  .cfg-input-wrap input{ padding-right:2.1rem; }
  .cfg-copy{
    position:absolute;
    top:50%; right:.3rem; transform:translateY(-50%);
    background:none;
    border:none;
    color:var(--dim);
    font:inherit;
    font-size:.62rem;
    cursor:pointer;
    padding:.1rem .2rem;
  }
  .cfg-copy:hover:not(:disabled){ color:var(--bright); }
  .cfg-copy.copied{ color:var(--bright); }
  .cfg-copy:disabled{ opacity:.3; cursor:default; }
  .cfg-copy:focus-visible{ outline:2px solid var(--focus); outline-offset:1px; }
  .cfg-note{ font-size:.68rem; color:var(--dim); width:100%; order:99; }

  /* ---------- Body (sidebar column + main column, side by side) ---------- */
  .body{
    flex:1;
    display:grid;
    grid-template-columns:280px 1fr;
    gap:20px;
    min-height:0;
    overflow:hidden;
  }
  /* Sidebar column: 2 stacked cards — brand (in .topbar-left, above) + nav card here */
  .sidebar{
    display:flex;
    flex-direction:column;
    min-height:0;
    overflow:hidden;
  }
  .sidebar-head{ padding:.9rem .9rem .5rem; }
  .search-wrap{ position:relative; }
  .search-wrap input{
    width:100%;
    background:var(--bg);
    border:1px solid var(--border);
    color:var(--ink);
    border-radius:2px;
    padding:.45rem .6rem .45rem 1.5rem;
    font-size:.85rem;
    font-family:inherit;
  }
  .search-wrap input::placeholder{ color:var(--dim); }
  .search-wrap input:focus-visible{ outline:2px solid var(--focus); }
  .search-wrap::before{
    content:"$";
    position:absolute;
    left:.55rem; top:50%; transform:translateY(-50%);
    color:var(--dim);
    font-weight:700;
    pointer-events:none;
  }
  .tree{ overflow-y:auto; padding:.25rem .55rem 1.25rem; flex:1; }
  details.tree-folder{ margin:.05rem 0; }
  details.tree-folder > summary{
    list-style:none;
    cursor:pointer;
    padding:.4rem .5rem;
    border-radius:2px;
    font-size:.86rem;
    display:flex;
    align-items:center;
    gap:.35rem;
    color:var(--ink);
    min-width:0;
  }
  .tree-label{
    flex:1 1 auto;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  details.tree-folder > summary::-webkit-details-marker{ display:none; }
  details.tree-folder > summary::before{
    content:"+"; color:var(--dim); font-weight:700; flex:none; width:.8em;
  }
  details.tree-folder[open] > summary::before{ content:"-"; }
  details.tree-folder > summary:hover{ background:var(--surface-2); }
  .tree > .tree-folder > summary{ font-weight:700; font-size:.85rem; letter-spacing:.02em; color:var(--bright); }
  .tree-children{ margin-left:.85rem; padding-left:.5rem; border-left:1px solid var(--border); }
  button.tree-file{
    display:block;
    width:100%;
    text-align:left;
    background:transparent;
    border:none;
    color:var(--dim);
    padding:.36rem .5rem;
    border-radius:2px;
    font-size:.83rem;
    cursor:pointer;
    font-family:inherit;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  button.tree-file:hover{ background:var(--surface-2); color:var(--ink); }
  button.tree-file.active{ background:var(--surface-2); color:var(--bright); font-weight:600; }
  button.tree-file:focus-visible,.search-wrap input:focus-visible{
    outline:2px solid var(--focus); outline-offset:1px;
  }
  .no-results{ color:var(--dim); font-size:.82rem; padding:.6rem .5rem; }

  /* ---------- Main content: 2 stacked cards — search card + viewer card ---------- */
  .content-outer{
    min-height:0; min-width:0;
    display:flex; flex-direction:column;
    gap:20px;
    overflow:hidden;
  }
  /* The tabbar/breadcrumb/note-viewer live together in one card */
  .viewer-card{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* content (whole-vault) search */
  .content-search{ position:relative; padding:18px 1.5rem; flex:none; }
  #contentSearchWrap .search-wrap input{ padding-right:2.4rem; }
  .search-clear{
    position:absolute;
    top:50%; right:.5rem; transform:translateY(-50%);
    background:none;
    border:none;
    color:var(--dim);
    font:inherit;
    font-size:.72rem;
    cursor:pointer;
    padding:.1rem .3rem;
  }
  .search-clear:hover{ color:var(--danger); }
  .search-clear:focus-visible{ outline:2px solid var(--focus); outline-offset:1px; }
  .search-dropdown{
    position:absolute;
    left:1.5rem;
    width:calc(100% - 3rem);
    margin-top:.3rem;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:2px;
    max-height:60vh;
    overflow-y:auto;
    z-index:25;
    box-shadow:var(--shadow);
  }
  .search-hit{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    border-bottom:1px solid var(--border);
    color:var(--ink);
    padding:.5rem .7rem;
    cursor:pointer;
    font-family:inherit;
  }
  .search-hit:last-child{ border-bottom:none; }
  .search-hit:hover,.search-hit:focus-visible{ background:var(--surface-2); outline:none; }
  .hit-name{ color:var(--bright); font-weight:700; font-size:.85rem; }
  .hit-path{ color:var(--dim); font-size:.7rem; margin-top:.1rem; }
  .hit-snippet{
    color:var(--code-ink);
    font-size:.74rem;
    margin-top:.3rem;
    background:var(--code-bg);
    padding:.2rem .45rem;
    border-radius:2px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .search-empty,.search-more{ padding:.55rem .7rem; color:var(--dim); font-size:.78rem; }
  .search-more{ font-style:italic; }

  /* open-tab bar */
  .tabbar{ display:none; align-items:stretch; gap:.4rem; padding:.6rem 1.5rem 0; border-bottom:1px solid var(--border); }
  .tabbar.has-tabs{ display:flex; }
  .tabs-scroll{ display:flex; align-items:stretch; gap:.25rem; overflow-x:auto; min-width:0; flex:1 1 auto; }
  .tab{
    display:flex;
    align-items:center;
    gap:.5rem;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-bottom:none;
    border-radius:2px 2px 0 0;
    padding:.35rem .45rem .35rem .6rem;
    white-space:nowrap;
    flex:none;
    color:var(--dim);
  }
  .tab.active{ background:var(--bg); border-color:var(--bright); color:var(--bright); }
  .tab-label{
    background:none; border:none; color:inherit; font:inherit; font-size:.78rem;
    cursor:pointer; padding:0; max-width:14rem; overflow:hidden; text-overflow:ellipsis;
  }
  .tab-close{
    background:none; border:none; color:var(--dim); font:inherit; font-size:.8rem;
    line-height:1; cursor:pointer; padding:0 .1rem;
  }
  .tab-close:hover{ color:var(--danger); }
  .tab-label:focus-visible,.tab-close:focus-visible{ outline:2px solid var(--focus); outline-offset:1px; }
  .tabs-close-all{
    flex:none;
    display:flex;
    align-items:center;
    align-self:stretch;
    margin-left:.5rem;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-bottom:none;
    border-radius:2px 2px 0 0;
    color:var(--dim);
    font:inherit;
    font-size:.78rem;
    padding:.35rem .6rem;
    cursor:pointer;
    white-space:nowrap;
  }
  .tabs-close-all:hover{ color:var(--danger); border-color:var(--danger); }
  .tabs-close-all:focus-visible{ outline:2px solid var(--focus); outline-offset:1px; }

  .breadcrumb{ padding:.85rem 1.5rem 0; font-size:.74rem; color:var(--dim); letter-spacing:.01em; }
  .content{ flex:1; overflow-y:auto; padding:.4rem 1.5rem 4rem; min-width:0; }
  .note{ max-width:62rem; margin:0 auto; }
  .note h1,.note h2,.note h3,.note h4,.note h5{ text-wrap:balance; line-height:1.3; }
  .note h1{ font-size:1.4rem; margin:1.3rem 0 .7rem; padding-bottom:.4rem; border-bottom:1px solid var(--border); }
  .note h2{ font-size:1.15rem; margin:1.5rem 0 .6rem; }
  .note h3{ font-size:1rem; margin:1.2rem 0 .5rem; }
  .note h4,.note h5{ font-size:.92rem; margin:1rem 0 .4rem; }
  .note p,.note li{ font-size:.9rem; line-height:1.65; max-width:70ch; }
  .note ul,.note ol{ padding-left:1.4rem; }
  .note a{ color:var(--bright); }
  .note a.tag-link{
    display:inline-block;
    color:var(--bright);
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:2px;
    padding:.05em .45em;
    font-size:.82em;
    text-decoration:none;
    cursor:pointer;
  }
  .note a.tag-link:hover,.note a.tag-link:focus-visible{
    color:var(--bg);
    background:var(--bright);
    border-color:var(--bright);
    outline:none;
  }
  .note blockquote{
    margin:.8rem 0;
    padding:.55rem .9rem;
    background:var(--surface-2);
    border-left:3px solid var(--bright);
    border-radius:0 2px 2px 0;
    color:var(--ink);
  }
  .note blockquote p{ margin:.25rem 0; max-width:none; }
  .note table{ border-collapse:collapse; width:100%; font-size:.83rem; }
  .note thead{ display:table-header-group; }
  .note th,.note td{ border:1px solid var(--border); padding:.4rem .6rem; text-align:left; vertical-align:top; }
  .note th{ background:var(--surface-2); color:var(--bright); }
  .table-scroll{ overflow-x:auto; margin:.8rem 0; }
  .note code{
    font-size:.85em;
    background:var(--code-bg);
    color:var(--code-ink);
    padding:.1em .35em;
    border-radius:2px;
  }
  .code-wrap{ position:relative; margin:.9rem 0; }
  .note pre{
    font-size:.82rem;
    line-height:1.55;
    background:var(--code-bg);
    color:var(--code-ink);
    border:1px solid var(--border);
    border-radius:3px;
    padding:1.9rem 1rem 1rem;
    overflow-x:auto;
  }
  .note pre code{ background:none; padding:0; border-radius:0; font-size:1em; }
  .code-line{
    position:relative;
    display:block;
    cursor:pointer;
    border-radius:2px;
    margin:0 -1rem;
    padding:0 1rem;
  }
  .code-line:hover{ background:rgba(73,255,126,.13); }
  .code-line.copied{ background:rgba(73,255,126,.32); }
  .line-copied-badge{
    position:absolute;
    top:50%; right:.5rem;
    transform:translateY(-50%);
    background:var(--bright);
    color:var(--bg);
    font-size:.62rem;
    font-weight:700;
    letter-spacing:.02em;
    padding:.05rem .45rem;
    border-radius:2px;
    pointer-events:none;
    opacity:0;
    white-space:nowrap;
  }
  .line-copied-badge.visible{ opacity:1; }
  @media (prefers-reduced-motion:no-preference){
    .code-line{ transition:background-color .15s ease; }
    .line-copied-badge{ transition:opacity .18s ease; }
  }
  .code-toolbar{ position:absolute; top:.4rem; right:.5rem; display:flex; align-items:center; gap:.4rem; }
  .lang-tag{
    font-size:.62rem; letter-spacing:.04em; color:var(--dim);
    background:var(--surface); border:1px solid var(--border); border-radius:2px; padding:.1rem .4rem;
  }
  .copy-btn{
    font-size:.68rem;
    background:var(--surface);
    color:var(--dim);
    border:1px solid var(--border);
    border-radius:2px;
    padding:.22rem .55rem;
    cursor:pointer;
    font-family:inherit;
  }
  .copy-btn:hover{ color:var(--bright); border-color:var(--bright); }
  .copy-btn.copied{ color:var(--bright); border-color:var(--bright); }
  .copy-btn:focus-visible{ outline:2px solid var(--focus); outline-offset:1px; }

  .var-filled{ color:var(--bright); font-weight:700; }
  .var-unset{ color:var(--danger); border-bottom:1px dashed var(--danger); cursor:help; }

  /* ---------- Syntax highlighting (highlight.js token classes) ---------- */
  .hljs-comment,.hljs-quote{ color:#6b8577; font-style:italic; }
  .hljs-string,.hljs-regexp{ color:#e3b341; }
  .hljs-number,.hljs-literal{ color:#ffb86c; }
  .hljs-keyword,.hljs-selector-tag,.hljs-type,.hljs-built_in{ color:#7ee7d8; }
  .hljs-title,.hljs-title.function_,.hljs-section{ color:#7bf1a8; font-weight:600; }
  .hljs-variable,.hljs-template-variable,.hljs-attr,.hljs-attribute{ color:#c9a7f0; }
  .hljs-name,.hljs-tag,.hljs-symbol,.hljs-bullet,.hljs-link{ color:#7ee7d8; }
  .hljs-meta,.hljs-meta .hljs-keyword{ color:#6b8577; }
  .hljs-params{ color:var(--code-ink); }
  .hljs-deletion{ color:#ff5f5f; }
  .hljs-addition{ color:#7bf1a8; }
  .hljs-emphasis{ font-style:italic; }
  .hljs-strong{ font-weight:700; }

  .empty-state{ max-width:32rem; margin:3rem auto; text-align:center; color:var(--dim); font-size:.9rem; }

  /* ---------- Themed scrollbars ---------- */
  .tree,
  .content,
  .tabs-scroll,
  .search-dropdown,
  .note pre,
  .table-scroll{
    scrollbar-width:thin;
    scrollbar-color:var(--border) var(--bg);
  }
  .tree::-webkit-scrollbar,
  .content::-webkit-scrollbar,
  .tabs-scroll::-webkit-scrollbar,
  .search-dropdown::-webkit-scrollbar,
  .note pre::-webkit-scrollbar,
  .table-scroll::-webkit-scrollbar{
    width:9px;
    height:8px;
  }
  .tree::-webkit-scrollbar-track,
  .content::-webkit-scrollbar-track,
  .tabs-scroll::-webkit-scrollbar-track,
  .search-dropdown::-webkit-scrollbar-track,
  .note pre::-webkit-scrollbar-track,
  .table-scroll::-webkit-scrollbar-track{
    background:var(--bg);
  }
  .tree::-webkit-scrollbar-thumb,
  .content::-webkit-scrollbar-thumb,
  .tabs-scroll::-webkit-scrollbar-thumb,
  .search-dropdown::-webkit-scrollbar-thumb,
  .note pre::-webkit-scrollbar-thumb,
  .table-scroll::-webkit-scrollbar-thumb{
    background-color:var(--border);
    border-radius:5px;
    border:2px solid var(--bg);
  }
  .tree::-webkit-scrollbar-thumb:hover,
  .content::-webkit-scrollbar-thumb:hover,
  .tabs-scroll::-webkit-scrollbar-thumb:hover,
  .search-dropdown::-webkit-scrollbar-thumb:hover,
  .note pre::-webkit-scrollbar-thumb:hover,
  .table-scroll::-webkit-scrollbar-thumb:hover{
    background-color:var(--dim);
  }
  .tree::-webkit-scrollbar-corner,
  .content::-webkit-scrollbar-corner{
    background:var(--bg);
  }

  @media (prefers-reduced-motion:no-preference){
    .copy-btn,button.tree-file,.menu-toggle{ transition:color .12s ease,border-color .12s ease; }
  }

  /* ---------- Responsive ---------- */
  @media (max-width:820px){
    .app{ padding:14px; gap:14px; }
    .body{ grid-template-columns:1fr; gap:14px; }
    .topbar{ grid-template-columns:1fr; gap:14px; }
    .content-outer{ gap:14px; }
    .cfg-groups{ flex-direction:column; }
    .menu-toggle{ display:inline-flex; }
    .sidebar{
      position:fixed;
      inset:14px 30% 14px 14px;
      z-index:40;
      border-radius:12px;
      transform:translateX(-115%);
      transition:transform .18s ease;
    }
    .sidebar.open{ transform:translateX(0); }
    .content-search{ padding:14px 1rem; }
    .content{ padding:.4rem 1rem 4rem; }
    .breadcrumb{ padding:.85rem 1rem 0; }
    .tabbar{ padding:.6rem 1rem 0; }
    .cfg-input-wrap{ width:7rem; }
    .cfg-field.port .cfg-input-wrap{ width:4.4rem; }
  }
  @media (max-width:460px){
    .sidebar{ inset:10px 10% 10px 10px; }
    .cfg-input-wrap{ width:6.2rem; }
    .cfg-field.port .cfg-input-wrap{ width:4rem; }
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "CheatSheet-config-v1";
  var FIELDS = ["attackerIp","attackerPort","victimIp","domain","dcIp"];
  var VAR_MAP = [
    ["ATTACKER_IP","attackerIp"],
    ["PORT","attackerPort"],
    ["VICTIM_IP","victimIp"],
    ["DOMAIN","domain"],
    ["DC_IP","dcIp"]
  ];
  var config = {};
  var tabs = [];
  var activeIndex = -1;
  var debounceTimer = null;
  var DATA = null;
  var ALL_FILES = [];

  function activeNode(){
    return (activeIndex >= 0 && tabs[activeIndex]) ? tabs[activeIndex].node : null;
  }

  function loadConfig(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }
  function saveConfig(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(config)); }catch(e){}
  }

  function escapeHtml(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  /* ---------- Obsidian-flavored markdown preprocessing (fence-aware) ---------- */
  var CALLOUT_TAGS = {
    info:"[i]", tip:"[tip]", warning:"[!]", danger:"[!!]", error:"[!!]",
    note:"[note]", question:"[?]", example:"[ex]", success:"[ok]", bug:"[bug]", quote:"[quote]"
  };

  function transformLine(line){
    var out = line.replace(/!\[\[([^\]]+)\]\]/g, function(_, name){
      return "*[image: " + name.trim() + "]*";
    });
    // Obsidian-style topic tags, e.g. #AD_DEFINATION_SPN — turn into a clickable
    // link that triggers the content search for that tag (handled in enhanceContent).
    out = out.replace(/#(AD_[A-Za-z0-9_]+)/g, function(_, tagName){
      return "[#" + tagName + "](tag:" + tagName + ")";
    });
    var m = out.match(/^(\s*>\s*)\[!(\w+)\]\s*(.*)$/);
    if (m){
      var type = m[2].toLowerCase();
      var tag = CALLOUT_TAGS[type] || "[*]";
      var title = m[3].trim();
      out = m[1] + tag + " **" + (title || m[2]) + "**";
    }
    return out;
  }

  function preprocessMarkdown(md){
    var lines = md.split("\n");
    var inFence = false, marker = "";
    var out = [];
    for (var i=0;i<lines.length;i++){
      var line = lines[i];
      var fm = line.match(/^(\s*)(```|~~~)/);
      if (fm){
        if (!inFence){ inFence = true; marker = fm[2]; out.push(line); continue; }
        else if (line.indexOf(marker) !== -1){ inFence = false; out.push(line); continue; }
        else { out.push(line); continue; }
      }
      out.push(inFence ? line : transformLine(line));
    }
    return out.join("\n");
  }

  function renderMarkdown(raw){
    return marked.parse(preprocessMarkdown(raw));
  }

  /* ---------- Syntax highlighting ---------- */
  var LANG_ALIASES = { "shell":"bash", "shell-session":"shellsession", "text":"plaintext", "plain":"plaintext" };

  function resolveLang(raw){
    if (!window.hljs) return null;
    var lang = (raw || "").toLowerCase().trim();
    if (LANG_ALIASES[lang]) lang = LANG_ALIASES[lang];
    if (hljs.getLanguage(lang)) return lang;
    if (/power/.test(lang) && hljs.getLanguage("powershell")) return "powershell";
    return null;
  }

  function highlightCodeBlocks(container){
    if (!window.hljs) return;
    container.querySelectorAll("pre code").forEach(function(code){
      var m = (code.className || "").match(/language-(\S+)/);
      var lang = resolveLang(m ? m[1] : "");
      var result;
      try{
        result = lang
          ? hljs.highlight(code.textContent, { language: lang, ignoreIllegals: true })
          : hljs.highlightAuto(code.textContent);
      }catch(e){ return; }
      code.innerHTML = result.value;
      code.classList.add("hljs");
    });
  }

  /* ---------- Variable substitution (runs on serialized HTML, after highlighting) ---------- */
  function substituteVariables(html){
    VAR_MAP.forEach(function(pair){
      var name = pair[0], field = pair[1];
      var val = (config[field] || "").trim();
      var re = new RegExp("\\$" + name + "(?![A-Z_])", "g");
      if (val){
        html = html.replace(re, '<span class="var-filled" title="$' + name + '">' + escapeHtml(val) + "</span>");
      } else {
        html = html.replace(re, '<span class="var-unset" title="Set ' + name + ' above to fill this in">$' + name + "</span>");
      }
    });
    return html;
  }

  /* ---------- Per-line splitting (so each line of a code block is individually
     hoverable/copyable) — walks the already-highlighted, already-substituted HTML
     and re-wraps it one <span class="code-line"> per source line, re-opening any
     tag that was left open across a line break so each line stays well-formed. ---------- */
  function splitHighlightedLines(html){
    var openTags = [];
    var lines = [];
    var current = "";
    var i = 0, n = html.length;

    function reopenPrefix(){
      var s = "";
      for (var k=0;k<openTags.length;k++) s += openTags[k].raw;
      return s;
    }
    function closeSuffix(){
      var s = "";
      for (var k=openTags.length-1;k>=0;k--) s += "</" + openTags[k].name + ">";
      return s;
    }

    while (i < n){
      var ch = html[i];
      if (ch === "<"){
        var end = html.indexOf(">", i);
        if (end === -1){ current += html.slice(i); break; }
        var tag = html.slice(i, end+1);
        current += tag;
        var m = tag.match(/^<\/?([a-zA-Z0-9-]+)/);
        if (m){
          var name = m[1];
          if (tag.charAt(1) === "/"){
            for (var k2=openTags.length-1;k2>=0;k2--){
              if (openTags[k2].name === name){ openTags.splice(k2,1); break; }
            }
          } else if (tag.charAt(tag.length-2) !== "/"){
            openTags.push({ name: name, raw: tag });
          }
        }
        i = end + 1;
        continue;
      }
      if (ch === "\n"){
        lines.push(current + closeSuffix());
        current = reopenPrefix();
        i++;
        continue;
      }
      current += ch;
      i++;
    }
    lines.push(current + closeSuffix());
    return lines;
  }

  function wrapCodeLines(code){
    var lines = splitHighlightedLines(code.innerHTML);
    code.innerHTML = lines.map(function(lineHtml){
      return '<span class="code-line">' + lineHtml + "</span>";
    }).join("");
  }

  /* ---------- Copy buttons + table scroll wrappers ---------- */
  function enhanceContent(container){
    container.querySelectorAll("pre").forEach(function(pre){
      var code = pre.querySelector("code");
      if (!code) return;

      wrapCodeLines(code);

      var wrap = document.createElement("div");
      wrap.className = "code-wrap";
      pre.parentNode.insertBefore(wrap, pre);
      wrap.appendChild(pre);

      var toolbar = document.createElement("div");
      toolbar.className = "code-toolbar";

      var langMatch = (code.className || "").match(/language-(\S+)/);
      if (langMatch){
        var tag = document.createElement("span");
        tag.className = "lang-tag";
        tag.textContent = "[" + langMatch[1] + "]";
        toolbar.appendChild(tag);
      }

      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "copy-btn";
      btn.textContent = "[copy]";
      btn.setAttribute("aria-label","Copy whole block to clipboard");
      btn.addEventListener("click", function(){
        var lineEls = code.querySelectorAll(".code-line");
        var text = lineEls.length
          ? Array.prototype.map.call(lineEls, function(el){ return el.textContent; }).join("\n")
          : code.textContent;
        copyText(text, btn);
      });
      toolbar.appendChild(btn);
      wrap.appendChild(toolbar);

      // Click a single line to copy just that line (doesn't hijack a manual text selection).
      code.addEventListener("click", function(e){
        var line = e.target.closest(".code-line");
        if (!line) return;
        var sel = window.getSelection();
        if (sel && sel.toString().length > 0) return;
        var lineText = line.textContent;
        if (!lineText.trim()) return;
        copyLine(lineText, line);
      });
    });

    container.querySelectorAll("table").forEach(function(table){
      var wrap = document.createElement("div");
      wrap.className = "table-scroll";
      table.parentNode.insertBefore(wrap, table);
      wrap.appendChild(table);
    });

    container.querySelectorAll('a[href^="tag:"]').forEach(function(a){
      a.classList.add("tag-link");
      a.removeAttribute("href");
      a.setAttribute("role","button");
      a.setAttribute("tabindex","0");
      a.addEventListener("click", function(e){
        e.stopPropagation(); // don't let the document-level "close dropdown on outside click" undo this
        triggerContentSearch(a.textContent.trim());
      });
      a.addEventListener("keydown", function(e){
        if (e.key === "Enter" || e.key === " "){
          e.preventDefault();
          e.stopPropagation();
          triggerContentSearch(a.textContent.trim());
        }
      });
    });
  }

  function writeClipboard(text, onSuccess, onFail){
    function tryFallback(){
      try{
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        onSuccess();
      }catch(e){
        if (onFail) onFail();
      }
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(onSuccess, tryFallback);
    } else {
      tryFallback();
    }
  }

  function copyText(text, btn, labels){
    labels = labels || {};
    var successLabel = labels.success || "[copied]";
    var resetLabel = labels.reset || "[copy]";
    var failLabel = labels.fail || "[select & copy manually]";
    writeClipboard(text, function(){
      btn.textContent = successLabel;
      btn.classList.add("copied");
      setTimeout(function(){ btn.textContent = resetLabel; btn.classList.remove("copied"); }, 1400);
    }, function(){
      btn.textContent = failLabel;
      setTimeout(function(){ btn.textContent = resetLabel; }, 1800);
    });
  }

  function showLineCopiedBadge(lineEl){
    var existing = lineEl.querySelector(".line-copied-badge");
    if (existing) existing.remove();
    var badge = document.createElement("span");
    badge.className = "line-copied-badge";
    badge.textContent = "[copied]";
    lineEl.appendChild(badge);
    requestAnimationFrame(function(){ badge.classList.add("visible"); });
    setTimeout(function(){
      badge.classList.remove("visible");
      setTimeout(function(){ if (badge.parentNode) badge.parentNode.removeChild(badge); }, 250);
    }, 700);
  }

  function copyLine(text, lineEl){
    writeClipboard(text, function(){
      lineEl.classList.add("copied");
      showLineCopiedBadge(lineEl);
      setTimeout(function(){ lineEl.classList.remove("copied"); }, 500);
    });
  }

  /* ---------- Tabs ---------- */
  function openTab(node, path){
    var idx = -1;
    for (var i=0;i<tabs.length;i++){ if (tabs[i].node === node){ idx = i; break; } }
    if (idx === -1){
      tabs.push({ node: node, path: path });
      idx = tabs.length - 1;
    }
    activeIndex = idx;
    renderTabs();
    renderActiveTab();
    if (window.matchMedia("(max-width:820px)").matches){
      closeSidebar();
    }
  }

  function closeTab(index){
    var wasActive = index === activeIndex;
    tabs.splice(index, 1);
    if (tabs.length === 0){
      activeIndex = -1;
    } else if (wasActive){
      activeIndex = Math.min(index, tabs.length - 1);
    } else if (index < activeIndex){
      activeIndex -= 1;
    }
    renderTabs();
    renderActiveTab();
  }

  function closeAllTabs(){
    tabs = [];
    activeIndex = -1;
    renderTabs();
    renderActiveTab();
  }

  function renderTabs(){
    var bar = document.getElementById("tabbar");
    var scroll = document.getElementById("tabsScroll");
    var closeAllBtn = document.getElementById("closeAllBtn");
    scroll.innerHTML = "";
    tabs.forEach(function(t, i){
      var tabEl = document.createElement("div");
      tabEl.className = "tab" + (i === activeIndex ? " active" : "");

      var label = document.createElement("button");
      label.type = "button";
      label.className = "tab-label";
      label.textContent = t.node.name;
      label.title = "~/" + t.path.concat(t.node.name).join("/");
      label.addEventListener("click", function(){
        activeIndex = i;
        renderTabs();
        renderActiveTab();
      });

      var closeBtn = document.createElement("button");
      closeBtn.type = "button";
      closeBtn.className = "tab-close";
      closeBtn.textContent = "x";
      closeBtn.setAttribute("aria-label", "Close " + t.node.name + " tab");
      closeBtn.addEventListener("click", function(e){
        e.stopPropagation();
        closeTab(i);
      });

      tabEl.appendChild(label);
      tabEl.appendChild(closeBtn);
      scroll.appendChild(tabEl);
    });
    bar.classList.toggle("has-tabs", tabs.length > 0);
    closeAllBtn.hidden = tabs.length === 0;
  }

  /* ---------- File rendering ---------- */
  function renderActiveTab(){
    var content = document.getElementById("content");
    var crumb = document.getElementById("breadcrumb");
    var t = tabs[activeIndex];

    document.querySelectorAll("button.tree-file").forEach(function(b){ b.classList.remove("active"); });

    if (!t){
      content.innerHTML = '<div class="empty-state">No notes open -- pick one from the sidebar.</div>';
      crumb.textContent = "";
      return;
    }

    content.innerHTML = '<article class="note">' + renderMarkdown(t.node.content || "*(empty note)*") + "</article>";
    highlightCodeBlocks(content);
    content.innerHTML = substituteVariables(content.innerHTML);
    enhanceContent(content);
    content.scrollTop = 0;
    crumb.textContent = "~/" + t.path.concat(t.node.name).join("/");
    if (t.node._btn) t.node._btn.classList.add("active");
  }

  /* ---------- Sidebar tree (filename-only filter) ---------- */
  // Folder/category labels sit next to a "+"/"-" prefix inside a flex <summary>;
  // wrapping the text in its own span lets it truncate independently, same as tree-file buttons.
  function setTreeLabel(el, text){
    var span = document.createElement("span");
    span.className = "tree-label";
    span.textContent = text;
    el.title = text;
    el.appendChild(span);
  }

  function buildTree(nodes, path, filter){
    var frag = document.createDocumentFragment();
    var any = false;
    nodes.forEach(function(node){
      if (node.type === "folder"){
        var childResult = buildTree(node.children, path.concat(node.name), filter);
        if (!childResult.any) return;
        any = true;
        var details = document.createElement("details");
        details.className = "tree-folder";
        if (filter) details.open = true;
        var summary = document.createElement("summary");
        setTreeLabel(summary, node.name + "/");
        details.appendChild(summary);
        var childWrap = document.createElement("div");
        childWrap.className = "tree-children";
        childWrap.appendChild(childResult.frag);
        details.appendChild(childWrap);
        frag.appendChild(details);
      } else {
        if (filter && node.name.toLowerCase().indexOf(filter) === -1) return;
        any = true;
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tree-file";
        btn.textContent = node.name;
        btn.title = node.name;
        node._btn = btn;
        btn.addEventListener("click", function(){ openTab(node, path); });
        frag.appendChild(btn);
      }
    });
    return { frag: frag, any: any };
  }

  function renderTree(filterRaw){
    var filter = (filterRaw || "").trim().toLowerCase();
    var treeEl = document.getElementById("tree");
    treeEl.innerHTML = "";
    var topFrag = document.createDocumentFragment();
    var anyTop = false;
    DATA.categories.forEach(function(cat){
      var result = buildTree(cat.children, [cat.label], filter);
      if (!result.any) return;
      anyTop = true;
      var details = document.createElement("details");
      details.className = "tree-folder";
      if (filter) details.open = true;
      var summary = document.createElement("summary");
      setTreeLabel(summary, "[" + cat.label + "]");
      details.appendChild(summary);
      var childWrap = document.createElement("div");
      childWrap.className = "tree-children";
      childWrap.appendChild(result.frag);
      details.appendChild(childWrap);
      topFrag.appendChild(details);
    });
    if (!anyTop){
      var none = document.createElement("div");
      none.className = "no-results";
      none.textContent = "no notes named \"" + filterRaw + "\"";
      treeEl.appendChild(none);
      return;
    }
    treeEl.appendChild(topFrag);
    var an = activeNode();
    if (an && an._btn) an._btn.classList.add("active");
  }

  function firstFilePath(nodes, path){
    for (var i=0;i<nodes.length;i++){
      var n = nodes[i];
      if (n.type === "file") return { node:n, path:path };
      if (n.type === "folder"){
        var f = firstFilePath(n.children, path.concat(n.name));
        if (f) return f;
      }
    }
    return null;
  }

  /* ---------- Whole-vault content search ---------- */
  function flattenFiles(nodes, path){
    nodes.forEach(function(n){
      if (n.type === "file") ALL_FILES.push({ node:n, path:path });
      else flattenFiles(n.children, path.concat(n.name));
    });
  }

  function updateBrandStats(){
    var el = document.getElementById("brandStats");
    if (!el) return;
    var counts = DATA.categories.map(function(cat){
      var n = 0;
      ALL_FILES.forEach(function(f){ if (f.path[0] === cat.label) n++; });
      return { label: cat.label, count: n };
    });
    el.textContent = ALL_FILES.length + " notes | " + DATA.categories.length + " sections";
    el.title = counts.map(function(c){ return c.label + ": " + c.count; }).join(" · ");
  }

  function findSnippet(text, q){
    var lines = text.split("\n");
    for (var i=0;i<lines.length;i++){
      var idx = lines[i].toLowerCase().indexOf(q);
      if (idx !== -1){
        var line = lines[i].trim();
        if (line.length > 100){
          var start = Math.max(0, idx - 30);
          line = (start > 0 ? "…" : "") + line.substr(start, 100) + "…";
        }
        return line;
      }
    }
    return "";
  }

  var MAX_HITS = 30;
  function runContentSearch(query){
    var box = document.getElementById("contentSearchResults");
    var q = query.trim().toLowerCase();
    if (!q){ box.hidden = true; box.innerHTML = ""; return; }

    var hits = ALL_FILES.filter(function(f){
      return (f.node.content || "").toLowerCase().indexOf(q) !== -1;
    });

    box.innerHTML = "";
    if (hits.length === 0){
      var none = document.createElement("div");
      none.className = "search-empty";
      none.textContent = "no notes contain \"" + query.trim() + "\"";
      box.appendChild(none);
      box.hidden = false;
      return;
    }

    hits.slice(0, MAX_HITS).forEach(function(f){
      var el = document.createElement("button");
      el.type = "button";
      el.className = "search-hit";

      var nameEl = document.createElement("div");
      nameEl.className = "hit-name";
      nameEl.textContent = f.node.name;
      el.appendChild(nameEl);

      var pathEl = document.createElement("div");
      pathEl.className = "hit-path";
      pathEl.textContent = "~/" + f.path.join("/");
      el.appendChild(pathEl);

      var snippet = findSnippet(f.node.content || "", q);
      if (snippet){
        var snipEl = document.createElement("div");
        snipEl.className = "hit-snippet";
        snipEl.textContent = snippet;
        el.appendChild(snipEl);
      }

      el.addEventListener("click", function(){
        openTab(f.node, f.path);
        box.hidden = true;
        document.getElementById("contentSearchInput").value = "";
      });
      box.appendChild(el);
    });

    if (hits.length > MAX_HITS){
      var more = document.createElement("div");
      more.className = "search-more";
      more.textContent = "showing first " + MAX_HITS + " of " + hits.length + " matches — refine your search";
      box.appendChild(more);
    }
    box.hidden = false;
  }

  function triggerContentSearch(query){
    var input = document.getElementById("contentSearchInput");
    var clearBtn = document.getElementById("contentSearchClear");
    input.value = query;
    if (clearBtn) clearBtn.hidden = !query;
    input.focus();
    runContentSearch(query);
  }

  /* ---------- Sidebar toggle (mobile) ---------- */
  function openSidebar(){
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("menuToggle").setAttribute("aria-expanded","true");
  }
  function closeSidebar(){
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("menuToggle").setAttribute("aria-expanded","false");
  }

  /* ---------- Config wiring ---------- */
  function refreshStatusDots(){
    FIELDS.forEach(function(f){
      var on = !!(config[f]||"").trim();
      var dot = document.getElementById("dot-" + f);
      if (dot){
        dot.textContent = on ? "[x] " : "[ ] ";
        dot.classList.toggle("on", on);
      }
      var copyBtn = document.getElementById("copy-" + f);
      if (copyBtn) copyBtn.disabled = !on;
    });
  }

  function wireConfigCopyButtons(){
    FIELDS.forEach(function(f){
      var btn = document.getElementById("copy-" + f);
      var input = document.getElementById(f);
      if (!btn || !input) return;
      btn.addEventListener("click", function(){
        if (!input.value) return;
        copyText(input.value, btn, { success:"[ok]", reset:"[c]", fail:"[!]" });
      });
    });
  }

  function onConfigInput(){
    FIELDS.forEach(function(f){
      var el = document.getElementById(f);
      if (el) config[f] = el.value;
    });
    refreshStatusDots();
    saveConfig();
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function(){
      renderActiveTab();
    }, 120);
  }

  function initConfigFields(){
    config = loadConfig();
    FIELDS.forEach(function(f){
      var el = document.getElementById(f);
      if (!el) return;
      el.value = config[f] || "";
      el.addEventListener("input", onConfigInput);
    });
    wireConfigCopyButtons();
    refreshStatusDots();
  }

  /* ---------- Boot ---------- */
  function boot(data){
    DATA = data;
    DATA.categories.forEach(function(cat){ flattenFiles(cat.children, [cat.label]); });
    updateBrandStats();

    initConfigFields();
    renderTree("");
    renderTabs();

    document.getElementById("treeSearchInput").addEventListener("input", function(e){
      renderTree(e.target.value);
    });

    var contentSearchTimer = null;
    var contentSearchInput = document.getElementById("contentSearchInput");
    var contentSearchClear = document.getElementById("contentSearchClear");
    contentSearchInput.addEventListener("input", function(e){
      var val = e.target.value;
      contentSearchClear.hidden = !val;
      clearTimeout(contentSearchTimer);
      contentSearchTimer = setTimeout(function(){ runContentSearch(val); }, 150);
    });
    contentSearchInput.addEventListener("keydown", function(e){
      if (e.key === "Escape"){
        e.target.value = "";
        contentSearchClear.hidden = true;
        document.getElementById("contentSearchResults").hidden = true;
      }
    });
    contentSearchClear.addEventListener("click", function(){
      contentSearchInput.value = "";
      contentSearchClear.hidden = true;
      var results = document.getElementById("contentSearchResults");
      results.hidden = true;
      results.innerHTML = "";
      contentSearchInput.focus();
    });
    document.addEventListener("click", function(e){
      var wrap = document.getElementById("contentSearchWrap");
      if (wrap && !wrap.contains(e.target)){
        document.getElementById("contentSearchResults").hidden = true;
      }
    });

    document.getElementById("closeAllBtn").addEventListener("click", closeAllTabs);

    document.getElementById("menuToggle").addEventListener("click", function(){
      if (document.getElementById("sidebar").classList.contains("open")) closeSidebar(); else openSidebar();
    });

    var firstCat = DATA.categories[0];
    var start = firstCat ? firstFilePath(firstCat.children, [firstCat.label]) : null;
    if (start) openTab(start.node, start.path);
  }

  fetch("data.json")
    .then(function(r){ return r.json(); })
    .then(boot)
    .catch(function(err){
      document.getElementById("content").innerHTML =
        '<div class="empty-state">Could not load cheatsheet data.<br>' + escapeHtml(String(err)) + "</div>";
    });
})();
</script>
