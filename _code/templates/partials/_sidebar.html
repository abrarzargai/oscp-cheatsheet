    <div class="sidebar-outer">
      <div class="sidebar-mode card">
        <fieldset class="cfg-group workspace-group">
          <legend>Workspace</legend>
          <div class="cfg-field workspace-field">
            <select id="modeSelect" class="proj-select">
              <option value="notes">Notes</option>
              <option value="engagement">Engagement</option>
              <option value="output">Findings</option>
              <option value="tools">Tools</option>
            </select>
          </div>
        </fieldset>
      </div>

      <aside class="sidebar card" id="sidebar">
        <div class="sidebar-head" id="notesSidebarHead">
          <div class="search-wrap">
            <input type="search" id="treeSearchInput" placeholder="filter by name..." aria-label="Filter notes by name">
          </div>
        </div>
        <nav class="tree" id="tree" aria-label="Cheatsheet sections"></nav>

        <nav class="tree" id="engagementTree" aria-label="Engagement playbook" hidden></nav>

        <nav class="tree" id="outputTree" aria-label="Saved command output" hidden></nav>

        <nav class="tree" id="toolsTree" aria-label="Tools" hidden></nav>

        <div class="sidebar-foot">
          <button type="button" class="sidebar-foot-btn" id="settingsToggle" title="Settings">[settings]</button>
          <button type="button" class="sidebar-foot-btn" id="sysmonToggle" title="System monitor — RAM, CPU, disk, processes">[system]</button>
        </div>
      </aside>
    </div>
