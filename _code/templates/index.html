<script>
  // Applied before the stylesheet/body render so a saved manual theme choice
  // never flashes the other theme first. System-preference light/dark (no
  // saved choice) needs no JS at all — theme.css's prefers-color-scheme
  // media query handles that on its own.
  (function(){
    try{
      var saved = localStorage.getItem("CheatSheet-theme-v1");
      if (saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
    }catch(e){}
  })();
</script>
<title>Cheatsheet</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap">
